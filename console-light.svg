<title id="title">Larry Peseckis — Field Console</title><desc id="desc">AI and cloud security architect. Capability is not authority. Success is not proof. A proposed action meets an authority boundary that checks scope, target, and freshness. Denied actions stop; permitted actions can reach consequence. This is a conceptual diagram, not live telemetry.</desc>
