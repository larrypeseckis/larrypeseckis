th="1.5" /><path d="M204 530H263" fill="none" stroke="#78E6CE" stroke-width="3" class="trace"/><rect x="263" y="493" width="343" height="103" rx="8" fill="#342B21" stroke="#F2BB76" stroke-width="1" /><circle cx="280" cy="514" r="4" fill="#F2BB76" stroke="none" stroke-width="1" class="gate-light"/><text x="296" y="520" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="16" font-weight="600" fill="#F2BB76" text-anchor="start" letter-spacing="0" >AUTHORITY BOUNDARY</text><text x="434" y="560" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="25" font-weight="600" fill="#EAF2F1" text-anchor="middle" letter-spacing="0" >May it do this, now?</text><text x="434" y="583" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="14" font-weight="400" fill="#9BABBA" text-anchor="middle" letter-spacing="0" >scope / target / freshness</text><path d="M432 596L432 647" fill="none" stroke="#78E6CE" stroke-width="1.5" /><text x="415" y="627" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="400" fill="#78E6CE" text-anchor="end" letter-spacing="0" >ALLOW</text><rect x="320" y="647" width="226" height="49" rx="6" fill="#111D29" stroke="#293B4A" stroke-width="1" /><text x="433" y="677" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="17" font-weight="600" fill="#EAF2F1" text-anchor="middle" letter-spacing="0" >CONSEQUENCE</text><path d="M263 573H219" fill="none" stroke="#F2BB76" stroke-width="1.5" /><path d="M219 564L219 582" fill="none" stroke="#F2BB76" stroke-width="2" /><text x="205" y="579" font-family="&#x27;SFMono-Regular&#x27;, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="12" font-weight="400" fill="#F2BB76" text-anchor="end" letter-spacing="0" >DENY</text><path d="M32 727H608" fill="none" stroke="#2