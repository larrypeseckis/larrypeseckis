<title id="title">MICRM — Machine-Initiated Consequence Reference Model</title><desc id="desc">A formal reference model that distinguishes consequence structure, authority and accountability closure, contribution-sensitive candidacy, and evidentiary warrant. A reference model with explicit limits, not a completed or universally validated theory.</desc>
